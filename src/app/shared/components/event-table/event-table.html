@if(withSearch) {
<mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
</mat-form-field>
}
<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        <!-- Title Column -->
        <ng-container matColumnDef="title">
            <th class="!font-semibold" mat-header-cell *matHeaderCellDef mat-sort-header> {{'common.title' | translate }} </th>
            <td mat-cell *matCellDef="let row"> {{row.title}} </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
            <th class="!font-semibold" mat-header-cell *matHeaderCellDef mat-sort-header> {{'common.description' | translate }} </th>
            <td mat-cell *matCellDef="let row"> {{row.description}}</td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="start_date">
            <th class="!font-semibold" mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <td mat-cell *matCellDef="let row"> {{row.start_date}} </td>
        </ng-container>

        <!-- Location Column -->
        <ng-container matColumnDef="location">
            <th class="!font-semibold" mat-header-cell *matHeaderCellDef mat-sort-header> {{'common.location' | translate}} </th>
            <td mat-cell *matCellDef="let row"> {{row.location}} </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
            <th class="!font-semibold" mat-header-cell *matHeaderCellDef aria-label="row actions"> Action(s) </th>
            <td mat-cell *matCellDef="let row">
                <button matIconButton (click)="handleTableAction('show')">
                    <i class="ri-eye-line text-blue-600 text-lg"></i>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">
                {{'common.no-data-found' | translate}}
            </td>
        </tr>
    </table>
    @if(withPagination) {
    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of events">
    </mat-paginator>
}
</div>

<div class="pb-9">
  <h1 class="text-xl font-semibold">
    {{ 'events.heading-title' | translate }}
  </h1>
</div>
<div class="flex flex-col gap-3 items-center shadow-md p-4">
  <div class="flex justify-between items-center w-full">
    <h1 class="text-lg">
      {{ 'events.events-list-label' | translate }}
    </h1>
    <div class="flex gap-1">
      <button mat-icon-button (click)="add()" [matTooltip]="'common.add' | translate">
        <i class="ri-add-circle-line !text-blue-600 !text-lg"></i>
      </button>
      <button mat-icon-button (click)="download()" [matTooltip]="'common.download' | translate">
        <i class="ri-download-line !text-green-600 !text-lg"></i>
      </button>
    </div>
  </div>
  @if (!isFetchingData) {
  <app-event-table
    class="w-full"
    [events]="events"
    [withSearch]="true"
    [withPagination]="true"
    [withAllActions]="true"
    (eventTableAction)="handleEventAction($event)"
  />
  }
</div>

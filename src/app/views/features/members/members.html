<div class="pb-9">
  <h1 class="text-xl font-semibold">
    {{ 'members.heading-title' | translate }}
  </h1>
</div>
<div class="flex flex-col gap-3 items-center shadow-md p-4">
  <div class="flex justify-between items-center w-full">
    <h1 class="text-lg">
      {{ 'members.members-list-label' | translate }}
    </h1>
    <div class="flex gap-1">
      <button mat-icon-button (click)="add()" [matTooltip]="'common.add' | translate">
        <i class="ri-add-circle-line !text-blue-600 !text-lg"></i>
      </button>
      <button mat-icon-button (click)="download()" [matTooltip]="'common.download' | translate">
        <i class="ri-download-line !text-green-600 !text-lg"></i>
      </button>
    </div>
  </div>
  @if (!isFetchingData) {
  <app-table
    class="w-full"
    [data]="members"
    [withSearch]="true"
    [withPagination]="true"
    [displayedColumns]="displayedColumns"
  >
    <ng-template appColumnTemplate="status" let-row>
      <div
        class="rounded-full {{
          row.status === status.ACTIVE
            ? 'bg-green-200 text-green-600'
            : row.status === status.IN_REVIEW
            ? 'bg-orange-200 text-orange-600'
            : 'bg-gray-200 text-gray-600'
        }} w-fit px-3 py-1  flex items-center justify-center"
      >
        {{ 'members.' + row.status | translate }}
      </div>
    </ng-template>

    <ng-template appColumnTemplate="joined_date" let-row>
      {{ row.joined_date | date : 'mediumDate' }}
    </ng-template>
    <ng-template appColumnTemplate="actions" let-row>
      <div class="!flex !gap-2">
        <button
          mat-icon-button
          (click)="view(row)"
          [matTooltip]="'common.view-details' | translate"
          class="!rounded-full hover:!bg-gray-100 !p-2"
        >
          <i class="ri-eye-line !text-blue-600 !text-lg"></i>
        </button>
        <button
          mat-icon-button
          (click)="edit(row)"
          [matTooltip]="'common.edit' | translate"
          class="!rounded-full hover:!bg-gray-100 !p-2"
        >
          <i class="ri-edit-line !text-green-600 !text-lg"></i>
        </button>
        <button
          mat-icon-button
          (click)="remove(row)"
          [matTooltip]="'common.delete' | translate"
          class="!rounded-full hover:!bg-gray-100 !p-2"
        >
          <i class="ri-delete-bin-line !text-red-600 !text-lg"></i>
        </button>
      </div>
    </ng-template>
  </app-table>
  }
</div>

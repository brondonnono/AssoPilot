<div class="!h-screen">
  <mat-nav-list>
    @for (item of navMenu; track item) {
    <a
      mat-list-item
      [routerLink]="item.path"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      disableRipple
      class="mb-2 !pr-9"
    >
      <i class="{{item.icon}}" matListItemIcon></i>
      <span matListItemTitle>{{ item.title | translate }}</span>
    </a>
    }
  </mat-nav-list>
</div>

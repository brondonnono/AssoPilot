<mat-toolbar class="!bg-blue-500 !text-white">
  <button matIconButton (click)="sidebarButtonClick()">
    <mat-icon class="!text-white">menu</mat-icon>
  </button>
  <a href="/">{{ appName }}</a>
  <span class="example-spacer"></span>
  <div class="flex items-center gap-1">
    <mat-icon class="!text-white">account_circle</mat-icon>
    <div class="flex flex-col text-center">
      <span class="text-sm font-medium">{{ currentUser.username }}</span>
      <span class="text-xs"> {{ 'role.' + currentUser.role | translate }}</span>
    </div>
    <button (click)="logout()" matIconButton [matTooltip]="'logout' | translate">
      <mat-icon class="!text-red-600">exit_to_app</mat-icon>
    </button>
  </div>
</mat-toolbar>

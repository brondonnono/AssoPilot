<app-header (sidebarToggle)="drawer.toggle()" class="sticky top-0 z-50" />
<mat-drawer-container autosize>
  <mat-drawer #drawer mode="side" class="!shadow-lg !w-fit" [opened]="isSidebarOpen">
    <app-sidebar />
  </mat-drawer>
  <mat-drawer-content>
    <div class="flex-1 !p-8 !h-screen">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
